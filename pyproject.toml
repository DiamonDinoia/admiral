# Wheel prototype: the C/C++ library, its C API headers and the CMake package. No Python bindings.
[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "admiral"
version = "0.0.1"
description = "Admiral FFT library: C and C++ APIs"
requires-python = ">=3.9"

[tool.scikit-build]
# The wheel holds no Python code, so one wheel per OS and architecture serves every Python.
wheel.py-api = "py3"
wheel.packages = []
wheel.install-dir = "admiral"
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
ADM_BUILD_TESTS = "OFF"
ADM_BUILD_BENCHMARKS = "OFF"
ADM_BUILD_EXAMPLES = "OFF"

[tool.cibuildwheel]
build = "cp312-*"
test-command = "python {project}/test/wheel/smoke.py"

# Portable baseline per platform. Never `native`. A later change switches ADM_DISPATCH on.
[[tool.cibuildwheel.overrides]]
select = "*-manylinux_x86_64 *-macosx_x86_64"
config-settings = {"cmake.define.ADM_TARGET_ARCH" = "x86-64"}

[[tool.cibuildwheel.overrides]]
select = "*-manylinux_aarch64"
config-settings = {"cmake.define.ADM_TARGET_ARCH" = "armv8-a"}

# "none" keeps the compiler default: -mcpu=none is not a CPU name, and MSVC otherwise adds /arch:AVX2.
[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64 *-win_amd64"
config-settings = {"cmake.define.ADM_TARGET_ARCH" = "none"}

[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel show {wheel} && auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
repair-wheel-command = "delocate-listdeps {wheel} && delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
