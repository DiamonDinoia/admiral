name: CI

on:
  # Every branch: a push has to be checked before a PR exists.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One cell per (toolchain, build type). The compiler axis is the point: gcc and clang disagree
  # about which diagnostics are errors, and a warning class only one of them raises is invisible
  # until that one is in the matrix.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Arch levels, one compiler, so the ISA axis stays cheap.
          - {os: ubuntu-24.04, toolchain: gcc-14, arch: x86-64}
          - {os: ubuntu-24.04, toolchain: gcc-14, arch: x86-64-v2}
          - {os: ubuntu-24.04, toolchain: gcc-14, arch: x86-64-v3}
          - {os: ubuntu-24.04, toolchain: gcc-14, arch: x86-64-v3, build_type: Debug}
          # Compiler levels, one arch.
          - {os: ubuntu-24.04, toolchain: gcc-13, arch: x86-64-v3}
          - {os: ubuntu-24.04, toolchain: gcc-15, arch: x86-64-v3}
          - {os: ubuntu-24.04, toolchain: llvm-18, arch: x86-64-v3}
          - {os: ubuntu-24.04, toolchain: llvm-19, arch: x86-64-v3}
          - {os: ubuntu-24.04, toolchain: llvm-20, arch: x86-64-v3}
          - {os: ubuntu-24.04, toolchain: llvm-21, arch: x86-64-v3}
          - {os: ubuntu-24.04, toolchain: llvm-21, arch: x86-64-v3, build_type: Debug}
          # Language standards, one compiler, one arch.
          - {os: ubuntu-24.04, toolchain: gcc-14, arch: x86-64-v3, std: 17}
          - {os: ubuntu-24.04, toolchain: gcc-14, arch: x86-64-v3, std: 23}
          - {os: ubuntu-24.04, toolchain: llvm-21, arch: x86-64-v3, std: 17}
          # Other targets.
          - {os: ubuntu-24.04-arm, toolchain: gcc-14, arch: armv8-a}
          - {os: macos-14, toolchain: apple-clang, arch: none}
          - {os: macos-15, toolchain: apple-clang, arch: none}
    name: ${{ matrix.toolchain }} ${{ matrix.arch }} c++${{ matrix.std || 20 }} ${{ matrix.build_type || 'Release' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.toolchain }}
          cmake: true
          ninja: true
          cache-tools: true
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.arch }}-${{ matrix.std || 20 }}-${{ matrix.build_type || 'Release' }}
      - name: Print versions
        run: |
          "$CXX" --version
          cmake --version
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type || 'Release' }} \
            -DADM_TARGET_ARCH=${{ matrix.arch }} \
            -DADM_CXX_STANDARD=${{ matrix.std || 20 }} \
            -DADM_BUILD_TESTS=ON -DADM_BUILD_BENCHMARKS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Assert the flags arrived
        if: matrix.arch != 'none'
        run: |
          grep -qF -- '=${{ matrix.arch }}' build/compile_commands.json
          ! grep -qF -- '=native' build/compile_commands.json
          grep -qF -- '-std=c++${{ matrix.std || 20 }}' build/compile_commands.json
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.os }}-${{ matrix.toolchain }}-${{ matrix.arch }}-${{ matrix.std || 20 }}-${{ matrix.build_type || 'Release' }}
          path: build/Testing/**
          if-no-files-found: ignore

  # MSVC has no `-march` and no POSIX allocator, so it exercises the portability arms nothing else
  # reaches. Multi-config generator, hence `--config` on every step.
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, toolchain: msvc}
          - {os: windows-2025, toolchain: msvc}
    name: ${{ matrix.toolchain }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.toolchain }}
          cmake: true
          vcvarsall: true
          cache-tools: true
      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DADM_TARGET_ARCH=x86-64-v3
          -DADM_BUILD_TESTS=ON -DADM_BUILD_BENCHMARKS=OFF
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.os }}-${{ matrix.toolchain }}
          path: build/Testing/**
          if-no-files-found: ignore

  # A preset that no longer configures is a broken entry point, and nothing else in CI reads them.
  presets:
    name: preset ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan, tsan, coverage, dev, release, relwithdebinfo]
    steps:
      - uses: actions/checkout@v7
      - uses: aminya/setup-cpp@v1
        with: {compiler: llvm-19, cmake: true, ninja: true, cache-tools: true}
      - run: cmake --preset ${{ matrix.preset }}

  # clang-tidy and cppcheck run as compiler launchers, so a finding fails this build.
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: aminya/setup-cpp@v1
        with:
          compiler: llvm-19
          clangtidy: "19"
          cppcheck: true
          cmake: true
          ninja: true
          cache-tools: true
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: static-analysis}
      - name: Print versions
        run: |
          clang-tidy --version
          cppcheck --version
      - name: clang-tidy
        run: |
          cmake -S . -B build/tidy -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" -DADM_TARGET_ARCH=x86-64-v3 \
            -DADM_BUILD_TESTS=OFF -DADM_BUILD_BENCHMARKS=OFF -DADM_BUILD_EXAMPLES=OFF \
            -DADM_ENABLE_CLANG_TIDY=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          grep -q 'HeaderFilterRegex' .clang-tidy
          cmake --build build/tidy --target admiral
      - name: clang-tidy positive control
        run: ./scripts/static_analysis_control.sh build/tidy
      - name: cppcheck
        run: |
          cmake -S . -B build/cppcheck -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX" -DADM_TARGET_ARCH=x86-64-v3 \
            -DADM_BUILD_TESTS=OFF -DADM_BUILD_BENCHMARKS=OFF -DADM_BUILD_EXAMPLES=OFF \
            -DADM_ENABLE_CPPCHECK=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/cppcheck --target admiral
      - name: cppcheck positive control
        run: ./scripts/static_analysis_control.sh build/cppcheck

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {preset: asan, cxx: clang++-18}
          - {preset: asan, cxx: g++-14}
          - {preset: tsan, cxx: g++-14}
    name: ${{ matrix.preset }} ${{ matrix.cxx }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: san-${{ matrix.preset }}-${{ matrix.cxx }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DADM_TARGET_ARCH=x86-64-v2
      - name: Assert the flags arrived
        run: |
          grep -qF -- '-fsanitize=' build/${{ matrix.preset }}/compile_commands.json
          grep -qF -- '-O1' build/${{ matrix.preset }}/compile_commands.json
          grep -qF -- '=x86-64-v2' build/${{ matrix.preset }}/compile_commands.json
          ! grep -qF -- '=native' build/${{ matrix.preset }}/compile_commands.json
      - run: cmake --build --preset ${{ matrix.preset }} -- -j 4
      - run: ctest --preset ${{ matrix.preset }} --no-tests=error
        env: {TSAN_OPTIONS: "handle_segv=0"}

  valgrind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y valgrind ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: valgrind}
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=g++-14 -DADM_TARGET_ARCH=x86-64-v2 -DADM_USE_FAST_MATH=OFF \
            -DADM_BUILD_TESTS=ON -DADM_BUILD_BENCHMARKS=OFF
          cmake --build build
      - name: Memcheck
        run: |
          for t in build/test/test_*; do
            [ -x "$t" ] || continue
            [ "$(basename "$t")" = test_ulp ] && continue
            [ "$(basename "$t")" = test_long_double ] && continue
            echo "--- $t"
            valgrind --error-exitcode=1 --leak-check=full \
              --errors-for-leak-kinds=definite "$t" '~[longdouble]'
          done

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: coverage}
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - run: cmake --preset coverage -DCMAKE_CXX_COMPILER=clang++-18
      - name: Assert the flags arrived
        run: |
          grep -qF -- '-fcoverage-mapping' build/coverage/compile_commands.json
          ! grep -qF -- '=native' build/coverage/compile_commands.json
      - run: cmake --build --preset coverage
      - name: Test
        run: |
          mkdir -p build/coverage/profraw
          ctest --preset coverage --no-tests=error
        env: {LLVM_PROFILE_FILE: "${{ github.workspace }}/build/coverage/profraw/%m.profraw"}
      - name: Report
        run: |
          profs=$(find build/coverage -name '*.profraw')
          llvm-profdata-18 merge -sparse $profs -o cov.profdata
          objs=$(find build/coverage/test -maxdepth 1 -type f -name 'test_*' ! -name '*.*')
          args=$(for o in $objs; do printf -- '-object %s ' "$o"; done)
          llvm-cov-18 report $args -instr-profile=cov.profdata
          llvm-cov-18 export $args -instr-profile=cov.profdata -format=lcov > coverage.lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            cov.profdata
            coverage.lcov

  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: install
      - name: Install to a prefix
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADM_TARGET_ARCH=x86-64-v2 \
            -DADM_BUILD_TESTS=OFF -DADM_BUILD_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          cmake --build build --target install
      - name: Consume it
        run: |
          cmake -S test/package -B build-pkg -G Ninja -DCMAKE_PREFIX_PATH=$PWD/prefix
          cmake --build build-pkg
          ctest --test-dir build-pkg --output-on-failure --no-tests=error

  v4-sde:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake g++-14 ninja-build
      - uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec  # v6.0
      - name: SDE wrapper
        run: |
          printf '#!/bin/sh\nexec "%s/sde64" -spr -- "$@"\n' "$SDE_PATH" | sudo tee /usr/local/bin/sde-spr
          sudo chmod +x /usr/local/bin/sde-spr
      - name: Build v4
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DADM_TARGET_ARCH=x86-64-v4 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CROSSCOMPILING_EMULATOR=/usr/local/bin/sde-spr
          grep -qF -- '=x86-64-v4' build/compile_commands.json
          ! grep -qF -- '=native' build/compile_commands.json
          cmake --build build -j "$(nproc)"
      - name: Test under SDE
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error -j "$(nproc)" --timeout 1800
          sde-spr build/benchmark/admiral_benchmark --verify

  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake g++-14 ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DADM_TARGET_ARCH=x86-64-v2 -DADM_CODELET_EXTRA_SIZES=66
          cmake --build build
          ctest --test-dir build --output-on-failure --no-tests=error

  nothreads:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake g++-14 ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DADM_TARGET_ARCH=x86-64-v2 -DADM_ENABLE_THREADS=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure --no-tests=error

  bench-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake g++-14 ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DADM_TARGET_ARCH=x86-64-v2 -DADM_BUILD_TESTS=OFF
          cmake --build build
          build/benchmark/admiral_benchmark --verify
