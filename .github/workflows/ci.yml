name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ISA levels are the point of this job. A GitHub runner is one microarchitecture,
  # so -march=native there proves nothing about anyone else's machine. x86-64-v4 has
  # no row here. The v4-sde leg below compiles the same -DADM_TARGET_ARCH=x86-64-v4
  # with the same g++-14 AND executes it, so a build-only row adds nothing.
  #
  # The aarch64 row is the non-x86 guard, and it is a native runner rather than qemu.
  # It costs a normal build instead of a 10-50x emulated one. It also covers the
  # -march=/-mcpu= split in CompilerOptions.cmake, which x86-only CI cannot see.
  # Validation for ppc64le and riscv64 happens out-of-band. No hosted runner exists, and gcc
  # 14.2 ICEs on -march=rv64gcv (a compiler bug, not an admiral one).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, cxx: g++-14, arch: x86-64}
          - {os: ubuntu-24.04, cxx: g++-14, arch: x86-64-v2}
          - {os: ubuntu-24.04, cxx: g++-14, arch: x86-64-v3}
          - {os: ubuntu-24.04, cxx: clang++-18, arch: x86-64-v3}
          - {os: ubuntu-24.04-arm, cxx: g++-14, arch: armv8-a}
          - {os: macos-14, cxx: clang++, arch: none}
    name: ${{ matrix.cxx }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        # Not preinstalled on either runner image.
        run: ${{ runner.os == 'macOS' && 'brew install ninja' || 'sudo apt-get update && sudo apt-get install -y ninja-build' }}
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-${{ matrix.cxx }}-${{ matrix.arch }}
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DADM_TARGET_ARCH=${{ matrix.arch }} \
            -DADM_BUILD_TESTS=ON -DADM_BUILD_BENCHMARKS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Assert the flags arrived
        # CMake accepts unknown -D names in silence and a second arch flag would win, so
        # this step asserts the configuration rather than assuming it. See scripts/validate.sh.
        # Matched without the flag prefix. CompilerOptions.cmake emits -mcpu= on
        # arm/powerpc and -march= elsewhere, so hardcoding -march= here would be a
        # false green on any non-x86 row.
        if: matrix.arch != 'none'
        run: |
          grep -qF -- '=${{ matrix.arch }}' build/compile_commands.json
          ! grep -qF -- '=native' build/compile_commands.json
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # The compiler is per-row because peak compile memory decides it, not taste. Measured
  # peak RSS on the heaviest TU (at the time: src/inst_plan_f.cpp, then the whole float
  # route tree in one `template class plan_impl<float>`; direction-split since), Debug
  # -O1 at x86-64-v2, against a 16 GB runner:
  #
  #   gcc  undefined         >15.8 GB, 630 s    gcc  address+undefined  >19.3 GB, 2044 s
  #   clang address+undefined  8.0 GB, 370 s    gcc  thread              6.9 GB,  425 s
  #
  # gcc's ASan is out at every ISA, native included (there that TU needed >60 GB and
  # 58 min). clang's costs 14% over the no-sanitizer control, so the ASan row runs clang
  # and keeps the full sanitizer set on the real code, nothing dropped or narrowed. The
  # thread row stays on gcc because gcc TSan already fits, and clang TSan is unmeasured
  # here; that also gives compiler diversity at no cost.
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {preset: asan, cxx: clang++-18}
          - {preset: tsan, cxx: g++-14}
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: san-${{ matrix.preset }}
      - name: Configure
        # The preset owns the flags (sanitizer, -O1, non-native ISA) so `cmake --preset
        # asan` means the same thing here and in a reader's terminal. Only two things are
        # runner-specific: the versioned compiler, and x86-64-v2 over the preset's
        # portable `none` because that is the cell the numbers above were measured at.
        run: cmake --preset ${{ matrix.preset }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DADM_TARGET_ARCH=x86-64-v2
      - name: Assert the flags arrived
        run: |
          grep -qF -- '-fsanitize=' build/${{ matrix.preset }}/compile_commands.json
          grep -qF -- '-O1' build/${{ matrix.preset }}/compile_commands.json
          grep -qF -- '=x86-64-v2' build/${{ matrix.preset }}/compile_commands.json
          ! grep -qF -- '=native' build/${{ matrix.preset }}/compile_commands.json
      # -j 4, not ninja's default of cores+2. The worst sanitized engine TU peaked at
      # 2.1 GB (clang ASan+UBSan, x86-64-v2, on the pre-direction-split inst_col_f), and
      # six of those would sit at 12.7 GB on a 16 GB runner with the rest of the job's
      # memory on top.
      - run: cmake --build --preset ${{ matrix.preset }} -- -j 4
      - run: ctest --preset ${{ matrix.preset }}

  # x86-64-v2 and no fast-math: valgrind cannot decode AVX-512, and a relaxed-FP build
  # makes the numeric assertions mean less than they say.
  valgrind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y valgrind ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: valgrind}
      # A standard hosted runner ships 14 GB of workspace, and this job ran it out:
      # `ld: final link failed: No space left on device` on the last few test binaries
      # and `ranlib: error reading codelet_41.cpp.o: No space left on device`, always
      # at the end of the build, never in a compile. Every test executable statically
      # links all 16 engine objects plus 65 codelets, so the tail of the build is where
      # the bytes land. These trees are preinstalled toolchains this job never touches.
      # `df` on both sides so the next occurrence reports a number instead of a guess.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DADM_TARGET_ARCH=x86-64-v2 -DADM_USE_FAST_MATH=OFF \
            -DADM_BUILD_TESTS=ON -DADM_BUILD_BENCHMARKS=OFF
          cmake --build build
      - name: Memcheck
        # This leg skips test_ulp for the reason scripts/validate.sh skips it. Its O(N^2)
        # long-double reference makes the binary minutes of pure arithmetic under
        # valgrind, and an empty filtered run exits 4 (Catch2's no-match code).
        run: |
          for t in build/test/test_*; do
            [ -x "$t" ] || continue
            [ "$(basename "$t")" = test_ulp ] && continue
            echo "--- $t"
            valgrind --error-exitcode=1 --leak-check=full \
              --errors-for-leak-kinds=definite "$t"
          done

  # clang source-based coverage (llvm-cov), not gcov. gcc's --coverage build is
  # assembler-bound on this tree (single-threaded GNU as; one TU took 1h50m),
  # while the clang instrumented build is an ordinary compile, and the
  # region/branch mapping survives -O1.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: coverage}
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # -D on the command line, not `env: CXX`. The preset pins CMAKE_CXX_COMPILER, and
      # a cacheVariable beats the environment, so CXX here was silently doing nothing and
      # the job depended on an unversioned /usr/bin/clang++ existing on the image.
      - run: cmake --preset coverage -DCMAKE_CXX_COMPILER=clang++-18
      - name: Assert the flags arrived
        run: |
          grep -qF -- '-fcoverage-mapping' build/coverage/compile_commands.json
          ! grep -qF -- '=native' build/coverage/compile_commands.json
      - run: cmake --build --preset coverage
      # Each binary writes its own profraw. Sharing the default path would silently corrupt
      # the profile across link-moduled objects. %m needs the directory to exist: the
      # profile runtime does not create it and the write fails silently without this.
      - name: Test
        run: |
          mkdir -p build/coverage/profraw
          ctest --preset coverage
        env: {LLVM_PROFILE_FILE: "build/coverage/profraw/%m.profraw"}
      - name: Report
        # Region/line coverage over the test binaries (the engine is templates; its
        # instantiation profile lives in the test objects, not the archives).
        run: |
          profs=$(find build/coverage -name '*.profraw')
          llvm-profdata-18 merge -sparse $profs -o cov.profdata
          objs=$(find build/coverage/test -maxdepth 1 -type f -name 'test_*' ! -name '*.*')
          args=$(for o in $objs; do printf -- '-object %s ' "$o"; done)
          llvm-cov-18 report $args -instr-profile=cov.profdata
          llvm-cov-18 export $args -instr-profile=cov.profdata -format=lcov > coverage.lcov
      - uses: codecov/codecov-action@v5
        with:
          # Public repo: tokenless upload. A lcov.export is what upload-artifact
          # cannot render; artifacts keep the raw profile for llvm-cov reruns.
          files: coverage.lcov
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        with: {name: coverage, path: |
                cov.profdata
                coverage.lcov}

  install:
    # A consumer sees the installed package, not the build tree. This catches an export
    # set that only resolves in-tree and a C driver missing the C++ runtime.
    # Not a linkage matrix. Both linkages always ship, and test/package links all
    # six targets from this one prefix: shared and static, C++ / C / FFTW.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: install
      - name: Install to a prefix
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DADM_TARGET_ARCH=x86-64-v2 \
            -DADM_BUILD_TESTS=OFF -DADM_BUILD_BENCHMARKS=OFF \
            -DCMAKE_INSTALL_PREFIX=$PWD/prefix
          cmake --build build --target install
      - name: Consume it
        run: |
          cmake -S test/package -B build-pkg -G Ninja -DCMAKE_PREFIX_PATH=$PWD/prefix
          cmake --build build-pkg
          ctest --test-dir build-pkg --output-on-failure

  # x86-64-v4 execution coverage. GitHub runners are not guaranteed AVX-512, so
  # this leg runs the v4 build under Intel SDE (-spr). Without it the W==8/W==16
  # pin rows, wide-radix tables and fused sweeps are CI-invisible.
  v4-sde:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y cmake g++-14 ninja-build
      # Third-party single-purpose action; pinned by sha.
      - uses: petarpetrovt/setup-sde@31aa4a8e85e109bef00f1d838613fcc6ec421271  # v5.0
      # A wrapper script, not "sde64;-spr" list syntax. List-form emulator values
      # reach Catch2's test discovery mangled (sde runs with no args at all).
      - name: SDE wrapper
        run: |
          printf '#!/bin/sh\nexec "%s/sde64" -spr -- "$@"\n' "$SDE_PATH" | sudo tee /usr/local/bin/sde-spr
          sudo chmod +x /usr/local/bin/sde-spr
      - name: Build v4
        # -j $(nproc) is required. ninja's own default is cores+2, and six
        # concurrent v4 engine TUs OOM the runner. Do not drop the -j.
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DADM_TARGET_ARCH=x86-64-v4 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CROSSCOMPILING_EMULATOR=/usr/local/bin/sde-spr
          grep -qF -- '=x86-64-v4' build/compile_commands.json
          ! grep -qF -- '=native' build/compile_commands.json
          cmake --build build -j "$(nproc)"
      - name: Test under SDE
        run: |
          ctest --test-dir build --output-on-failure -j "$(nproc)" --timeout 1800
          sde-spr build/benchmark/admiral_benchmark --verify

  # Non-default codelet catalog: the only legs that reach rader_inner_kind::codelet
  # (the tests skip when no codelet-sized prime needs it). Mirrors
  # scripts/validate.sh's catalog arm.
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y cmake g++-14 ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DADM_TARGET_ARCH=x86-64-v2 -DADM_CODELET_EXTRA_SIZES=66
          cmake --build build
          ctest --test-dir build --output-on-failure

  # Threads-off: the whole library must also work with ADM_ENABLE_THREADS=OFF
  # (the #else pool path), which nothing else compiles.
  nothreads:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y cmake g++-14 ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DADM_TARGET_ARCH=x86-64-v2 -DADM_ENABLE_THREADS=OFF
          cmake --build build
          ctest --test-dir build --output-on-failure

  # The benchmark binary is also the codelet-scale verifier. --verify sweeps the
  # whole codelet catalog [2..64] plus the large-N decomposition sizes, covering
  # catalog TUs 17..64 that sanitizer builds cap out of. Cheap: one Release x86-64-v2
  # build, minutes of runtime.
  bench-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y cmake g++-14 ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DADM_TARGET_ARCH=x86-64-v2 -DADM_BUILD_TESTS=OFF
          cmake --build build
          build/benchmark/admiral_benchmark --verify
