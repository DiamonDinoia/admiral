name: Arch probe

# Measurement, not a candidate. Builds and tests admiral on the numpy wheel targets that no
# earlier probe ran (numpy v2.5.4 wheels.yml:39-45, windows.yml:79-80): musllinux_1_2 x86_64 and
# aarch64, Windows ARM64 (cl and clang-cl) and Windows x86. x86_64 glibc is the control.
# The musl cells run inside the pypa musllinux_1_2 image through `docker exec`, not `container:`,
# because the runner has no musl node for JavaScript actions on arm64.
# The Windows cells use Ninja under vcvars. `amd64_x86` is the toolset `-A Win32` picks on a
# 64-bit host, and Ninja compiles in parallel where the Visual Studio generator does not.
on:
  push:
    branches: ['probe/port-extra']

# No concurrency group: a fix pushed during a two-hour Windows run must not cancel it.
jobs:
  probe:
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # Control. Baseline ISA per numpy: X86_V2.
          - {name: x86_64-glibc, os: ubuntu-24.04, kind: native, arch: x86-64-v2, expect: '-march=x86-64-v2'}
          - {name: x86_64-musl, os: ubuntu-24.04, kind: musl, image: quay.io/pypa/musllinux_1_2_x86_64, arch: x86-64-v2, expect: '-march=x86-64-v2'}
          - {name: aarch64-musl, os: ubuntu-24.04-arm, kind: musl, image: quay.io/pypa/musllinux_1_2_aarch64, arch: armv8-a, expect: '-march=armv8-a'}
          # cl has no per-level arch switch on ARM64. Its default is armv8.0 with NEON.
          - {name: arm64-msvc, os: windows-11-arm, kind: win, vcarch: arm64, cxx: cl, arch: none, cpu: ARM64}
          - {name: arm64-clang-cl, os: windows-11-arm, kind: win, vcarch: arm64, cxx: clang-cl, arch: armv8-a, cpu: ARM64, expect: '-march=armv8-a'}
          # numpy's baseline on 32-bit cl is /arch:SSE2 (meson_cpu/x86/meson.build:83), the cl default.
          - {name: x86-msvc, os: windows-2022, kind: win, vcarch: amd64_x86, cxx: cl, arch: none, cpu: X86}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (glibc)
        if: matrix.kind == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-14
      - name: Start musl container
        if: matrix.kind == 'musl'
        run: |
          set -eu
          docker run -d --name musl -v /home/runner/work:/home/runner/work \
            -w "$GITHUB_WORKSPACE" '${{ matrix.image }}' sleep infinity
          docker exec musl apk add --no-cache samurai
          docker exec musl sh -c 'cat /etc/alpine-release; gcc --version | head -1; ldd 2>&1 | head -1'
          echo "X=docker exec -w $GITHUB_WORKSPACE musl" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.kind == 'win'
        with:
          arch: ${{ matrix.vcarch }}
      - name: Locate clang-cl
        if: matrix.cxx == 'clang-cl'
        run: |
          set -eu
          for d in "$(cygpath -u "$VCINSTALLDIR")/Tools/Llvm/ARM64/bin" "/c/Program Files/LLVM/bin"; do
            if [ -x "$d/clang-cl.exe" ]; then
              cygpath -w "$d" >> "$GITHUB_PATH"
              "$d/clang-cl.exe" --version
              exit 0
            fi
          done
          echo "no clang-cl on this image"
          exit 1
      - name: Configure
        run: |
          set -eu
          mkdir -p logs
          args=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
                -DADM_TARGET_ARCH=${{ matrix.arch }}
                -DADM_BUILD_TESTS=ON -DADM_BUILD_BENCHMARKS=OFF
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON)
          case '${{ matrix.kind }}' in
            native) args+=(-DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14) ;;
            win) args+=(-DCMAKE_C_COMPILER=${{ matrix.cxx }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}) ;;
          esac
          unset NINJA_STATUS
          if ! ${X:-} cmake "${args[@]}" > logs/configure.log 2>&1; then
            grep -n -m3 -E 'CMake Error|Error' logs/configure.log || true
            tail -n 40 logs/configure.log
            exit 1
          fi
          tail -n 5 logs/configure.log
      - name: Assert the flags arrived
        run: |
          set -eu
          if [ -n '${{ matrix.expect }}' ]; then
            grep -qF -- '${{ matrix.expect }}' build/compile_commands.json
          fi
          ! grep -qF -- '=native' build/compile_commands.json
          if [ -n '${{ matrix.cpu }}' ]; then
            grep -h 'COMPILER_ARCHITECTURE_ID' build/CMakeFiles/*/CMakeCXXCompiler.cmake
            grep -qE 'CMAKE_CXX_COMPILER_ARCHITECTURE_ID "?${{ matrix.cpu }}"?\)' build/CMakeFiles/*/CMakeCXXCompiler.cmake
          fi
      - name: Build
        run: |
          set -u
          unset NINJA_STATUS
          rc=0
          ${X:-} cmake --build build -j${{ matrix.kind == 'win' && 4 || 3 }} -- -k 0 > logs/build.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "failed TUs: $(grep -c '^FAILED' logs/build.log)"
            echo "first error:"
            grep -n -m5 -E 'error|FAILED:' logs/build.log || true
            tail -n 40 logs/build.log
          fi
          exit "$rc"
      - name: Test
        run: |
          set -u
          rc=0
          start=$(date +%s)
          ${X:-} ctest --test-dir build -j2 --timeout 1800 --output-on-failure --no-tests=error \
            > logs/ctest.log 2>&1 || rc=$?
          echo "ctest wall: $(( $(date +%s) - start )) s"
          grep -E 'tests passed|tests failed|Total Test time' logs/ctest.log || true
          if [ "$rc" -ne 0 ]; then
            grep -E '\*\*\*|Failed|Timeout|Not Run' logs/ctest.log | head -n 30 || true
          fi
          exit "$rc"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.name }}
          path: |
            logs/**
            build/Testing/**
          if-no-files-found: ignore
